<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Título</h1>
    </header> 
    <section>
        <div id="res">
            
        </div>
        <div id="calculadora">
            <div id="num">
                <button class="botão" data-valor="1">
                    1
                </button>
                <button class="botão" data-valor="2">
                    2
                </button>
                <button class="botão" data-valor="3">
                    3
                </button>
                <button class="botão" data-valor="4">
                    4
                </button>
                <button class="botão" data-valor="5">
                    5
                </button>
                <button class="botão" data-valor="6">
                    6
                </button>
                <button class="botão" data-valor="7">
                    7
                </button>
                <button class="botão" data-valor="8">
                    8
                </button>
                <button class="botão" data-valor="9">
                    9
                </button>
                <button class="botão" data-valor="0">
                    0
                </button>
            </div>

            <div id="operação">
                <button id="limpar">
                    limpar
                </button>
                <button class="operadores" data-valor="+"> 
                    +
                </button>
                <button class="operadores" data-valor="-">
                    -
                </button>
                <button class="operadores" data-valor="x" >
                    x
                </button>
                <button class="operadores" data-valor="%">
                    %
                </button>
                <button id="resultado-conta">
                    =
                </button>
            </div>
        </div>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>
    <script src="script.js">

    </script>
</body>
</html>
