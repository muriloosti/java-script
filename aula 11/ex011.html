<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Países</title>
</head>
<body>
    <h1>Você é brasileiro</h1>   
    <label for="pais"></label>
    <input type="text" name="paises" id="paises">
    <input type="button" value="enviar" onclick="clicar()">
    <div id="res">

    </div>

    <script>
        function clicar() {
            var pais = window.document.getElementById('paises')
            var res = window.document.getElementById('res')
            if (pais.value == 'brasil') {
                res.innerHTML = 'Você é brasileiro'
            }   else {
                res.innerHTML = 'você é estrageiro'
            }
        }  
    </script>
</body>
</html>
